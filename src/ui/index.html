<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OurMusic — Reproductor de Audio HiFi</title>
    <link rel="stylesheet" href="./css/components.css" />
  </head>
  <body>
    <div class="om-Window" id="app-window">
      <!-- 1. Barra Lateral de Navegación -->
      <div id="sidebar-container"></div>

      <!-- 2. Área Principal de Contenido (Topbar + Vistas) -->
      <main class="om-Main" id="main-container">
        <div id="topbar-container"></div>
        <div id="main-content-slot" style="flex:1;display:flex;flex-direction:column;overflow:hidden"></div>
      </main>

      <!-- 3. Barra de Reproducción Persistente (Now Playing Bar) -->
      <div id="nowplaying-container" style="grid-area:npbar"></div>
    </div>

    <!-- Script Principal con Módulos ES -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
